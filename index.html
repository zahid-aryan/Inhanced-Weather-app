<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <div class="search">
            <input type="search" placeholder="Enter city name" id="cityInput">
            <img src="./images/search.png" alt="">
        </div>
        <div class="error">
            <p>Invalid city name</p>
        </div>
        <div class="weather">
            <!-- Weather information will be displayed here -->
            <div class="weather-icon">
                <img src="./images/back.jpg" alt="weather-icon">
            </div>
            <div class="place">
                <h1 class="temprature">33c </h1>
                <h2 class="city">Kandahar</h2>
                <h3 class="country">Af</h3>
            </div>

        </div>
        <div class="details">
            <div class="col">
                <div>
                    <img src="./images/humidity.png" alt="">

                </div>
                <p class="humidity">Humidity 50%</p>
            </div>
            <div class="col">
                <div>
                    <img src="./images/wind.png" alt="">

                </div>
                <p class="wind-speed">Wind speed 3 km/h</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>

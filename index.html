<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEATHER</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="card">
        <div class="search">
            <input type="search" placeholder="Enter city name...">
            <img src="/images/search.png" alt="" cl>
        </div>
        <div class="error">
            <p class="errorpar">Invalid city name.</p>
        </div>
        <div class="weather">
            <div>
                <img class="weather-icon" src="" alt="">
            </div>
            <h1 class="temprature"></h1>
            <h2 class="city"></h2>
            <h3 class="country"></h3>
            <div class="details">
                <div class="col">
                    <img src="./images/humidity.png" alt="Humidity icon">
                    <div>
                        <h2>Humidty</h2>
                        <p class="humidity"> </p>
                    </div>
                </div>
                <div class="col wind">
                    <img src="./images/mist.png" alt="wind Icon">
                    <div>
                        <h2>wind Spead</h2>
                        <p class="wind-spead"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
